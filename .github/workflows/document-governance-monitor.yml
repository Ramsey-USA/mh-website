name: Document Governance Monitor

on:
  pull_request:
    branches: [main]
    paths:
      - "documents/content/mh-ecosystem/**"
      - "scripts/documents/build-factory-intake-manifest.mjs"
      - "scripts/validation/check-mh-ecosystem-authority.mjs"
      - "scripts/validation/check-ecosystem-phase0-reconciliation.mjs"
      - "apps/website/src/lib/data/controlled-document-redirects.json"
      - "apps/website/src/app/go/docs/**"
      - "apps/website/scripts/validation/check-controlled-document-architecture.mjs"
      - ".github/workflows/document-governance-monitor.yml"
  push:
    branches: [main]
    paths:
      - "documents/content/mh-ecosystem/**"
      - "scripts/documents/build-factory-intake-manifest.mjs"
      - "scripts/validation/check-mh-ecosystem-authority.mjs"
      - "scripts/validation/check-ecosystem-phase0-reconciliation.mjs"
      - "apps/website/src/lib/data/controlled-document-redirects.json"
      - "apps/website/src/app/go/docs/**"
      - "apps/website/scripts/validation/check-controlled-document-architecture.mjs"
      - ".github/workflows/document-governance-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: document-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    name: Verify document authority and release controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify Ecosystem authority
        run: node scripts/validation/check-mh-ecosystem-authority.mjs
      - name: Verify Phase 0 reconciliation
        run: node scripts/validation/check-ecosystem-phase0-reconciliation.mjs
      - name: Verify factory intake manifest
        run: node scripts/documents/build-factory-intake-manifest.mjs --check
      - name: Verify private factory and stable redirects
        run: node apps/website/scripts/validation/check-controlled-document-architecture.mjs

      - name: Signal private factory when Ecosystem authority changes
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.MH_DOCUMENT_FACTORY_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "MH_DOCUMENT_FACTORY_TOKEN is not configured; private factory dispatch remains disabled."
            exit 0
          fi
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Ramsey-USA/mh-document-factory/dispatches \
            --data "{\"event_type\":\"mh-ecosystem-source-updated\",\"client_payload\":{\"source_repository\":\"${GITHUB_REPOSITORY}\",\"source_sha\":\"${SOURCE_SHA}\"}}"
