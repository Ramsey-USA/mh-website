name: Generate Controlled Document PDFs

on:
  pull_request:
    branches: [main]
    paths:
      - "documents/**"
      - "apps/website/scripts/**"
      - "scripts/maintenance/**"
      - "scripts/validation/**"
      - ".github/workflows/generate-pdfs.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "documents/**"
      - "apps/website/scripts/**"
      - "scripts/maintenance/**"
      - "scripts/validation/**"
      - ".github/workflows/generate-pdfs.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      section:
        description: "Single MISH section number; leave blank for the complete set"
        required: false
        default: ""
      brand:
        description: "Brand ID"
        required: true
        type: choice
        options: [mhc, hdd]
        default: mhc
      publish:
        description: "Publish the validated artifact to production R2"
        required: true
        type: boolean
        default: false
      release_confirmation:
        description: "Type PUBLISH APPROVED DOCUMENTS to authorize production publication"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: controlled-pdfs-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PDF_ARTIFACT_NAME: controlled-document-pdfs

jobs:
  generate-and-validate:
    name: Generate and validate controlled PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          skip-checkout: "true"
          fetch-depth: "1"
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update -qq
          if apt-cache show libasound2t64 >/dev/null 2>&1; then
            ALSA_PKG="libasound2t64"
          else
            ALSA_PKG="libasound2"
          fi
          sudo apt-get install -y --no-install-recommends \
            libatk-bridge2.0-0 libatk1.0-0 libcups2 libdbus-1-3 \
            libgbm1 libgtk-3-0 libnss3 libx11-6 libx11-xcb1 \
            libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 \
            libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 \
            xdg-utils ca-certificates fonts-liberation libappindicator3-1 \
            "$ALSA_PKG" libpango-1.0-0 libpangocairo-1.0-0

      - name: Install Chrome browser for Puppeteer
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Export Puppeteer executable path
        run: echo "PUPPETEER_EXECUTABLE_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Validate Ecosystem release authority
        run: pnpm ecosystem:authority:check

      - name: Validate Ecosystem reconciliation and binder treatment plan
        run: |
          pnpm ecosystem:phase0:check
          pnpm ecosystem:pdf-manifest:build
          git diff --exit-code -- documents/content/mh-ecosystem/ecosystem-pdf-manifest.json
          pnpm ecosystem:pdf-pipeline:check

      - name: Validate controlled release workflow
        run: pnpm ecosystem:release-workflow:check

      - name: Validate canonical document layout
        run: pnpm docs:sync:check

      - name: Build source manifests
        run: pnpm docs:extract-word

      - name: Generate complete controlled document set
        if: ${{ inputs.section == '' || inputs.section == null }}
        working-directory: apps/website
        run: |
          BRAND="${{ inputs.brand || 'mhc' }}"
          npm run docs:generate -- --template cover --brand "$BRAND"
          npm run docs:generate -- --template spine --brand "$BRAND"
          npm run docs:generate -- --template tabs --brand "$BRAND"
          npm run docs:generate -- --template sections --brand "$BRAND"
          npm run docs:generate:forms
          npm run docs:merge
          npm run docs:merge:digital

      - name: Generate selected MISH section
        if: ${{ inputs.section != '' && inputs.section != null }}
        working-directory: apps/website
        run: |
          BRAND="${{ inputs.brand || 'mhc' }}"
          npm run docs:generate -- --template section --section "${{ inputs.section }}" --brand "$BRAND"

      - name: Enforce strict visual run-off gate
        if: ${{ inputs.section == '' || inputs.section == null }}
        working-directory: apps/website
        run: |
          npm run docs:audit:mish-overrun
          npm run docs:audit:mish-overrun:check

      - name: Build complete Ecosystem package binders and master notebook
        run: |
          pnpm ecosystem:binders:build
          pnpm ecosystem:binders:check

      - name: Validate QR assets and targets
        working-directory: apps/website
        run: npm run qr:test

      - name: Create release checksums
        working-directory: apps/website
        run: |
          cd documents/generated-pdfs
          find . -type f -name '*.pdf' -print0 \
            | sort -z \
            | xargs -0 sha256sum > sha256-manifest.txt

      - name: Upload validated release candidate
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PDF_ARTIFACT_NAME }}
          path: apps/website/documents/generated-pdfs/
          if-no-files-found: error
          retention-days: 14

  publish-production:
    name: Publish approved PDFs to production
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish == true &&
      inputs.release_confirmation == 'PUBLISH APPROVED DOCUMENTS'
    needs: generate-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-documents

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          skip-checkout: "true"
          fetch-depth: "1"
          node-version: ${{ env.NODE_VERSION }}

      - name: Download validated release candidate
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.PDF_ARTIFACT_NAME }}
          path: apps/website/documents/generated-pdfs

      - name: Verify release checksums
        working-directory: apps/website/documents/generated-pdfs
        run: sha256sum --check sha256-manifest.txt

      - name: Enforce approved document lifecycle
        run: pnpm ecosystem:publication:check

      - name: Publish approved PDFs to Cloudflare R2
        working-directory: apps/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BUCKET="mh-construction-assets"
          SRC="documents/generated-pdfs"
          find "$SRC" -type f -name '*.pdf' ! -path "$SRC/controlled-ecosystem/*" -print0 | while IFS= read -r -d '' file; do
            REL="${file#$SRC/}"
            pnpm exec wrangler r2 object put "$BUCKET/docs/$REL" \
              --file "$file" \
              --content-type "application/pdf" \
              --remote
          done

      - name: Verify published document URLs
        working-directory: apps/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: mh-construction-assets
        run: npm run docs:verify:published
