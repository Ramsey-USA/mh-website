name: Validate Images & Videos

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/website/public/images/**"
      - "apps/website/public/videos/**"
      - ".github/workflows/optimize-media.yml"
      - "apps/website/scripts/optimization/**"

permissions:
  contents: read

concurrency:
  group: media-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Controlled Media Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Reject derived QR assets
        shell: bash
        run: |
          DERIVED_QR_ASSETS="$(find apps/website/public/images/qr-codes -type f \
            \( -name "*.webp" -o -name "*.avif" \) -print 2>/dev/null || true)"
          if [ -n "$DERIVED_QR_ASSETS" ]; then
            echo "Derived QR assets are prohibited. QR codes remain controlled PNG/SVG artifacts."
            echo "$DERIVED_QR_ASSETS"
            exit 1
          fi

      - name: Enforce image size budget
        shell: bash
        run: |
          OVERSIZED="$(find apps/website/public/images -type f \
            \( -name "*.webp" -o -name "*.avif" -o -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) \
            ! -path "apps/website/public/images/qr-codes/*" -size +500k -print 2>/dev/null || true)"
          if [ -n "$OVERSIZED" ]; then
            echo "Media assets exceeding the 500 KB production budget:"
            echo "$OVERSIZED"
            exit 1
          fi

      - name: Enforce video size budget
        shell: bash
        run: |
          OVERSIZED_WEBM="$(find apps/website/public/videos -name "*.webm" \
            ! -path "apps/website/public/videos/hero-commercials/*" -size +10M -print 2>/dev/null || true)"
          OVERSIZED_MP4="$(find apps/website/public/videos -name "*.mp4" \
            ! -path "apps/website/public/videos/hero-commercials/*" -size +15M -print 2>/dev/null || true)"
          if [ -n "$OVERSIZED_WEBM$OVERSIZED_MP4" ]; then
            echo "Video assets exceed the production budget."
            [ -n "$OVERSIZED_WEBM" ] && echo "$OVERSIZED_WEBM"
            [ -n "$OVERSIZED_MP4" ] && echo "$OVERSIZED_MP4"
            exit 1
          fi

      - name: Record validation result
        run: |
          {
            echo "## Controlled Media Validation"
            echo ""
            echo "- No direct writes to main"
            echo "- No derived QR-code formats"
            echo "- Image and video budgets passed"
            echo "- Optimization outputs must enter through a reviewed pull request"
          } >> "$GITHUB_STEP_SUMMARY"
