name: One-time dependency repair

on:
  push:
    branches:
      - agent/enterprise-phase-2-closeout
    paths:
      - .github/workflows/one-time-pdfjs-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix(security): upgrade pdfjs-dist to patched release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/enterprise-phase-2-closeout
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm --recursive update "pdfjs-dist@^6.2.108" --lockfile-only
      - name: Commit repaired dependency state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/website/package.json pnpm-lock.yaml
          git diff --cached --quiet || git commit -m "fix(security): upgrade pdfjs-dist to patched release"
          git push origin HEAD:agent/enterprise-phase-2-closeout
