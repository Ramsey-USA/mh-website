name: One-shot Nano ID lock repair

on:
  push:
    branches:
      - codex/cache-purge-credential-correction
    paths:
      - .github/workflows/repair-nanoid-lock.yml

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          ref: codex/cache-purge-credential-correction
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate frozen lock metadata
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit repaired lock and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/repair-nanoid-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/repair-nanoid-lock.yml
          git commit -m "security: regenerate nanoid lock metadata"
          git push origin HEAD:codex/cache-purge-credential-correction
