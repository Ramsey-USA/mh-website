name: CI/CD Pipeline

# Source of truth: this workflow validates and deploys production via wrangler.
# Disable Cloudflare Dashboard Git auto-deploy to avoid duplicate builds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_PUBLIC_SITE_URL: https://www.mhc-gc.com
  HUSKY: "0"
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Workspace-level quality checks (run once for whole monorepo)
  # ──────────────────────────────────────────────────────────────
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          skip-checkout: "true"
          fetch-depth: "0"
          node-version: ${{ env.NODE_VERSION }}

      - name: Enforce IndexNow key for main checks
        if: >-
          github.actor != 'dependabot[bot]' &&
          ((github.event_name == 'pull_request' && github.base_ref == 'main') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
          )
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "${INDEXNOW_KEY}" ]; then
            echo "INDEXNOW_KEY secret is required for main branch SEO checks."
            exit 1
          fi

      - name: Enforce generated artifact guard
        run: npm run guard:generated-artifacts

      - name: Enforce branding docs contracts guard
        run: npm run docs:guardrails:contracts

      - name: Enforce docs stack/version congruency guard
        run: npm run docs:stack:congruency:check

      - name: Enforce team-profiles legacy import guard
        run: npm run team-profiles:legacy-imports:check

      - name: Enforce migration mirror sync guard
        run: npm run migrations:sync:check

      - name: Enforce root script wrapper sync guard
        run: npm run scripts:sync:check

      - name: Enforce app mirror sync guard
        run: npm run app:mirrors:sync:check

      - name: Enforce manual template congruence guard
        run: npm run docs:guardrails:manual-congruence

      - name: Detect Lighthouse artifact changes
        id: perf_changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | grep -q '^lighthouse-results/summary\.json$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Lighthouse summary artifact (strict)
        if: steps.perf_changes.outputs.changed == 'true'
        working-directory: apps/website
        run: npm run perf:gate

      - name: Sync docs/messages/documents into app
        run: bash scripts/docs/sync-to-app.sh

      - name: Run TypeScript type check — website
        working-directory: apps/website
        run: npm run type-check

      - name: Run ESLint — website
        working-directory: apps/website
        run: npm run lint

      - name: Enforce enterprise release command
        working-directory: apps/website
        run: npm run enterprise:release:check

      - name: Enforce MHC intellectual property governance
        working-directory: apps/website
        run: npm run ip:governance:check

      - name: Verify SEO route policy sync — website
        working-directory: apps/website
        run: npm run seo:routes:sync:check

      - name: Validate SEO route indexing policy — website
        working-directory: apps/website
        run: npm run seo:routes:check

      - name: Verify route integrity — website
        working-directory: apps/website
        run: npm run verify:route-integrity

      - name: Validate Jeremy SEO signal coverage — website
        working-directory: apps/website
        run: npm run seo:jeremy:signals:check

      - name: Validate Jeremy route metadata coverage — website
        working-directory: apps/website
        run: npm run seo:jeremy:metadata:check

      - name: Restore Prettier cache
        uses: actions/cache@v6
        with:
          path: .prettier-cache
          key: prettier-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            prettier-cache-${{ hashFiles('pnpm-lock.yaml') }}-
            prettier-cache-

      - name: Run Prettier check
        run: npm run format:check

      - name: Run Brand Lint
        env:
          BRAND_LINT_CHANGED_ONLY: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          BRAND_LINT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: npm run lint:brand

      - name: Run tests — website
        working-directory: apps/website
        timeout-minutes: 10
        run: npm run test:ci:fast

      - name: Check public asset budgets
        working-directory: apps/website
        run: npm run check:asset-budgets

      - name: Check hero commercial guardrails
        working-directory: apps/website
        run: npm run check:hero-commercials

      - name: Check client terminology guardrails
        working-directory: apps/website
        run: npm run terminology:guardrails:check

      - name: Enforce strict Spanish coverage signals
        working-directory: apps/website
        env:
          SPANISH_COVERAGE_STRICT: "1"
        run: npm run report:spanish:coverage

      - name: Check for unused dependencies — website
        working-directory: apps/website
        run: npm run deps:check

  # Security Audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          skip-checkout: "true"
          node-version: ${{ env.NODE_VERSION }}

      - name: Run internal dependency security check
        run: npm run security:check

  # Build Verification — Website
  build-website:
    name: Build Next.js (Website)
    runs-on: ubuntu-latest
    needs: [quality-checks]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          skip-checkout: "true"
          node-version: ${{ env.NODE_VERSION }}
          install-command: pnpm install --frozen-lockfile --filter @mhc/website... --filter @mhc/shared... --loglevel error

      - name: Restore Next.js build cache (website)
        uses: actions/cache@v6
        with:
          path: |
            apps/website/.next/cache
            apps/website/.open-next/cache
          key: nextjs-website-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{
            hashFiles('apps/website/src/**', 'packages/shared/src/**', 'apps/website/next.config.js', 'apps/website/open-next.config.ts') }}
          restore-keys: |
            nextjs-website-cache-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-website-cache-

      - name: Enforce IndexNow key for production deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "${INDEXNOW_KEY}" ]; then
            echo "INDEXNOW_KEY secret is required for main deploys."
            exit 1
          fi

      - name: Build website
        working-directory: apps/website
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run verify:route-integrity
            npm run build:next
          else
            npm run build
          fi

      - name: Check bundle size
        working-directory: apps/website
        run: npm run bundle:report

  # Build Verification — Dashboard
  build-dashboard:
    name: Build Next.js (Dashboard)
    runs-on: ubuntu-latest
    needs: [quality-checks]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          skip-checkout: "true"
          node-version: ${{ env.NODE_VERSION }}
          install-command: pnpm install --frozen-lockfile --filter @mhc/dashboard... --filter @mhc/shared... --loglevel error

      - name: Restore Next.js build cache (dashboard)
        uses: actions/cache@v6
        with:
          path: |
            apps/dashboard/.next/cache
            apps/dashboard/.open-next/cache
          key: nextjs-dashboard-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{
            hashFiles('apps/dashboard/src/**', 'packages/shared/src/**', 'apps/dashboard/next.config.js', 'apps/dashboard/open-next.config.ts') }}
          restore-keys: |
            nextjs-dashboard-cache-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-dashboard-cache-

      - name: Verify SSSP factory fail-closed controls
        working-directory: apps/dashboard
        run: npm run test:ci -- safety-sssp-generate.test.ts sssp-factory.test.ts

      - name: Build dashboard
        working-directory: apps/dashboard
        run: npm run build

  # Deploy to Cloudflare Workers — runs only on pushes to main
  deploy-website:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: [build-website, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          skip-checkout: "true"
          node-version: ${{ env.NODE_VERSION }}
          install-command: pnpm install --frozen-lockfile --filter @mhc/website... --filter @mhc/shared... --loglevel error

      - name: Restore Next.js build cache (website)
        uses: actions/cache@v6
        with:
          path: |
            apps/website/.next/cache
            apps/website/.open-next/cache
          key: nextjs-website-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{
            hashFiles('apps/website/src/**', 'packages/shared/src/**', 'apps/website/next.config.js', 'apps/website/open-next.config.ts') }}
          restore-keys: |
            nextjs-website-cache-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-website-cache-

      - name: Build website
        working-directory: apps/website
        run: npm run build

      - name: Deploy to Cloudflare Workers
        working-directory: apps/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          WRANGLER_SEND_METRICS: "false"
        run: npm run deploy

      - name: Submit sitemap updates to search engines
        working-directory: apps/website
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.NEXT_PUBLIC_SITE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: npm run seo:sitemaps:submit

      - name: Purge Cloudflare cache after production deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ZONE_ID}" ]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID are required for production cache invalidation."
            exit 1
          fi

          response="$(curl --fail-with-body --silent --show-error \
            --request POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything":true}')"

          if [ "$(jq -r '.success' <<<"$response")" != "true" ]; then
            echo "Cloudflare rejected the production cache purge."
            jq -c '{errors, messages}' <<<"$response"
            exit 1
          fi

          echo "Cloudflare production cache purge completed."

  # Deploy dashboard API routes to their dedicated Cloudflare Worker.
  deploy-dashboard:
    name: Deploy Dashboard API Worker
    runs-on: ubuntu-latest
    needs: [build-dashboard, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          skip-checkout: "true"
          node-version: ${{ env.NODE_VERSION }}
          install-command: pnpm install --frozen-lockfile --filter @mhc/dashboard... --filter @mhc/shared... --loglevel error

      - name: Build dashboard
        working-directory: apps/dashboard
        run: npm run build

      - name: Deploy dashboard Worker
        working-directory: apps/dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npm run deploy

      - name: Verify protected SSSP route ownership
        shell: bash
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}'             https://www.mhc-gc.com/api/safety/sssp/deployment-probe)"
          if [ "$status" = "404" ] || [ "$status" -ge 500 ]; then
            echo "Dashboard SSSP route is not operational. HTTP $status"
            exit 1
          fi
          echo "Dashboard SSSP route is owned by the deployed Worker. HTTP $status"
