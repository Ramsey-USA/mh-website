name: Integration Branch Format Repair

on:
  push:
    branches:
      - agent/document-factory-sync

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v7
        with:
          ref: agent/document-factory-sync
          fetch-depth: 0
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          skip-checkout: 'true'
      - name: Apply repository formatting
        run: |
          pnpm exec prettier --write \
            .github/workflows/document-governance-monitor.yml \
            docs/technical/controlled-document-factory.md \
            documents/content/mh-ecosystem/factory-intake-manifest.json \
            documents/content/mh-ecosystem/factory-sync-contract.json \
            package.json \
            scripts/documents/build-factory-intake-manifest.mjs
      - name: Commit format repair
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/document-governance-monitor.yml \
            docs/technical/controlled-document-factory.md \
            documents/content/mh-ecosystem/factory-intake-manifest.json \
            documents/content/mh-ecosystem/factory-sync-contract.json \
            package.json \
            scripts/documents/build-factory-intake-manifest.mjs
          git commit -m "fix: normalize document factory integration formatting"
          git push origin HEAD:agent/document-factory-sync
