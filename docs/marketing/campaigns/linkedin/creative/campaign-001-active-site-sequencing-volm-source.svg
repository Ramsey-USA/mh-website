<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">The schedule must fit the operation</title>
  <desc id="desc">MH Construction field note using verified Volm Companies project photography from Pasco, Washington.</desc>
  <defs>
    <style>
      @font-face {
        font-family: "Mendl Sans Dusk";
        src: url("source/Mendl-Sans-Dusk-Regular.otf") format("opentype");
        font-weight: 400;
      }
      @font-face {
        font-family: "Mendl Sans Dusk";
        src: url("source/Mendl-Sans-Dusk-SemiBold.otf") format("opentype");
        font-weight: 700;
      }
      .mendl { font-family: "Mendl Sans Dusk", Arial, sans-serif; }
    </style>
    <linearGradient id="photoShade" x1="0" x2="1">
      <stop offset="0" stop-color="#0F1713" stop-opacity="0.72"/>
      <stop offset="0.45" stop-color="#0F1713" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0F1713" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E392C"/>
      <stop offset="1" stop-color="#0F1713"/>
    </linearGradient>
    <clipPath id="photoClip"><rect x="440" width="760" height="627"/></clipPath>
  </defs>

  <rect width="1200" height="627" fill="#0F1713"/>
  <g clip-path="url(#photoClip)">
    <image href="source/volm-companies-main-entrance.jpg" x="408" y="0" width="824" height="627" preserveAspectRatio="xMidYMid slice"/>
    <rect x="440" width="760" height="627" fill="url(#photoShade)"/>
  </g>

  <path d="M0 0H525L455 627H0Z" fill="url(#panel)"/>
  <rect x="0" y="0" width="14" height="627" fill="#BD9264"/>
  <rect x="60" y="181" width="96" height="5" rx="2.5" fill="#BD9264"/>

  <image href="source/mh-logo-white.png" x="58" y="35" width="215" height="122" preserveAspectRatio="xMinYMin meet"/>

  <text class="mendl" x="60" y="224" fill="#D9BD93" font-size="19" font-weight="700" letter-spacing="3.4">FIELD NOTE 001 / ACTIVE-SITE DELIVERY</text>
  <text class="mendl" x="60" y="298" fill="#FFFFFF" font-size="53" font-weight="700" letter-spacing="0.4">
    <tspan x="60" dy="0">THE SCHEDULE</tspan>
    <tspan x="60" dy="60">MUST FIT THE</tspan>
    <tspan x="60" dy="60">OPERATION.</tspan>
  </text>

  <text class="mendl" x="60" y="525" fill="#E6E1D7" font-size="22" font-weight="400">Scope. Access. Logistics. Handoff.</text>
  <text class="mendl" x="60" y="572" fill="#BD9264" font-size="18" font-weight="700" letter-spacing="2.2">VOLM COMPANIES / PASCO, WA</text>

  <g transform="translate(772 525)">
    <rect width="366" height="62" rx="4" fill="#0F1713" fill-opacity="0.87"/>
    <rect width="7" height="62" fill="#BD9264"/>
    <text class="mendl" x="28" y="27" fill="#D9BD93" font-size="15" font-weight="700" letter-spacing="2">MH CONSTRUCTION</text>
    <text class="mendl" x="28" y="48" fill="#FFFFFF" font-size="14" font-weight="400">Built on Quality, Backed by Trust.</text>
  </g>
</svg>

