name = "mhc-v2-dashboard"
main = ".open-next/worker.js"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_SITE_URL = "https://www.mhc-gc.com"
SSSP_CALLBACK_BASE_URL = "https://www.mhc-gc.com"
# Transport remains provisioned but disabled until project-profile intake captures
# hazards, competent persons, emergency controls, attachments, and approval gates.
SSSP_FACTORY_ACTIVATED = "false"

# ========================================================================
# Route Ownership
# ========================================================================
# This Worker handles the following routes on www.mhc-gc.com:
#   /api/auth/*          — authentication
#   /api/safety/*        — safety forms and SSSP management
#   /api/drivers/*       — driver management
#   /api/leads/*         — leads CRM
#   /api/analytics/dashboard* — dashboard analytics
#   /api/testimonials/*  — testimonial publishing
#   /api/team-profile/*  — team profile management
#   /api/functions/*     — AI/automation functions
#   /api/security/*      — security audit events
#
# The website Worker (mhc-v2-website) handles www.mhc-gc.com/* for all
# other public pages and public API routes (contact, newsletter, etc.).
# Cloudflare routes the more-specific admin API paths to this Worker first.
# ========================================================================

# KV Namespaces (shared with website worker — same zone, same data)
[[kv_namespaces]]
binding = "CACHE"
id = "b6ecda1ca7a7463db0f8a3b5d9681131"

[[kv_namespaces]]
binding = "NEXT_CACHE_WORKERS_KV"
id = "c7473e6da0dc44d5874f3bd58032b43d"

[[kv_namespaces]]
binding = "ANALYTICS"
id = "969e74f0815b47ce9e75ae5acfe2a70d"

# R2 buckets (shared with website worker where applicable)
[[r2_buckets]]
binding = "SAFETY_INTAKE"
bucket_name = "mh-construction-safety-intake"

[[r2_buckets]]
binding = "SSSP_PLANS"
bucket_name = "mh-construction-sssp-plans"

[[r2_buckets]]
binding = "SSSP_OUTPUT"
bucket_name = "mh-construction-sssp-output"

# Private document factory work orders. The offline factory consumes through
# Cloudflare's authenticated HTTP Pull API; no public webhook is exposed.
[[queues.producers]]
binding = "SSSP_FACTORY_WORK_ORDERS"
queue = "mhc-sssp-factory-work-orders"

# D1 Database (shared with website worker — same database)
[[d1_databases]]
binding = "DB"
database_id = "98ad144a-cfe2-4f19-a55c-c43140279840"

# Cron Triggers — daily driver license monitoring alerts at 7:00 AM Pacific (14:00 UTC)
[triggers]
crons = ["0 14 * * *"]

# Explicit production routes for dashboard worker.
[[routes]]
pattern = "www.mhc-gc.com/api/auth/*"
zone_name = "mhc-gc.com"

[[routes]]
pattern = "www.mhc-gc.com/api/safety/*"
zone_name = "mhc-gc.com"

[[routes]]
pattern = "www.mhc-gc.com/api/drivers/*"
zone_name = "mhc-gc.com"

[[routes]]
pattern = "www.mhc-gc.com/api/leads/*"
zone_name = "mhc-gc.com"

[[routes]]
pattern = "www.mhc-gc.com/api/analytics/dashboard*"
zone_name = "mhc-gc.com"

[[routes]]
pattern = "www.mhc-gc.com/api/testimonials/*"
zone_name = "mhc-gc.com"

[[routes]]
pattern = "www.mhc-gc.com/api/team-profile/*"
zone_name = "mhc-gc.com"

[[routes]]
pattern = "www.mhc-gc.com/api/functions/*"
zone_name = "mhc-gc.com"

[[routes]]
pattern = "www.mhc-gc.com/api/security/*"
zone_name = "mhc-gc.com"

# Workers Logs and Traces for production incident response.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
